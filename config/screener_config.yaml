active_preset: quality_compounder

presets:
  quality_compounder:
    rank_by: composite_quality_score
    filters:
      roe_min: 15
      de_max: 1.0
      fcf_min: 0
      revenue_cagr_5yr_min: 10
  value_pick:
    rank_by: fcf_yield_pct
    filters:
      pe_max: 30
      pb_max: 5.0
      de_max: 2.0
      dividend_yield_min: 0.5
  growth_accelerator:
    rank_by: pat_cagr_5yr
    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2.0
  dividend_champion:
    rank_by: dividend_yield_pct
    filters:
      dividend_yield_min: 2.0
      dividend_payout_max: 80
      fcf_min: 0
  debt_free_blue_chip:
    rank_by: return_on_equity_pct
    filters:
      de_max: 0.1
      roe_min: 12
      sales_min: 1000
  turnaround_watch:
    rank_by: revenue_cagr_3yr
    filters:
      revenue_cagr_3yr_min: 10
      fcf_min: 0
      de_declining: true

filters: {}