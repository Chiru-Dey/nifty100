[project]
name = "nifty100"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "matplotlib>=3.7",
    "nltk>=3.8",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.18",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "reportlab>=4.1",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "streamlit>=1.30",
    "uvicorn>=0.27",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.10",
    "notebook>=7.0",
    "pre-commit>=3.7",
    "pytest>=7.4",
    "pytest-html>=4.1",
    "ruff>=0.4",
]

[tool.black]
target-version = ['py312']
